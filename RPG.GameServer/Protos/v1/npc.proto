syntax = "proto3";
option csharp_namespace = "RPG.GameServer.QueryProtos";

package rpg.query.v1;

import "common.proto";
import "skill.proto";

service NpcQuery {
  rpc GetNpc(NpcGetByIdRequest) returns (NpcSingleReply);
  rpc ListNpcs(NpcListRequest) returns (NpcListReply);
  rpc GetNpcsByIds(NpcGetByIdsRequest) returns (NpcListReply);
}

message NpcSingleReply { Npc npc = 1; }
message NpcListReply { repeated Npc npcs = 1; }

message NpcStatsEntry {
  string stat = 1;
  int32 value = 2;
}

message NpcSkillEntry {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string tags = 4;
  bool is_active = 5;
}

message Npc {
  string id = 1;
  string name = 2;
  string display_name = 3;
  string description = 4;
  int32 level = 5;
  bool is_moving = 6;
  bool is_rotating = 7;
  int32 current_health = 8;
  int32 max_health = 9;
  string map_name = 10;
  repeated string tags = 11;
  Location location = 12;
  map<string, int32> base_stats = 13;
  map<string, int32> modified_stats = 14;
  repeated NpcSkillEntry skills = 15;
  repeated Component components = 16;
}

message NpcGetByIdRequest { string id = 1; }
message NpcListRequest {}
message NpcGetByIdsRequest { repeated string ids = 1; }
