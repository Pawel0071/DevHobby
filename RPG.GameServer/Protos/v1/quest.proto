syntax = "proto3";
option csharp_namespace = "RPG.GameServer.QueryProtos";

package rpg.query.v1;

import "common.proto";

service QuestQuery {
  rpc GetQuest(QuestGetByIdRequest) returns (QuestSingleReply);
  rpc ListQuests(QuestListRequest) returns (QuestListReply);
  rpc GetQuestsByIds(QuestGetByIdsRequest) returns (QuestListReply);
}

message QuestGetByIdRequest { string id = 1; }
message QuestListRequest {}
message QuestGetByIdsRequest { repeated string ids = 1; }

message QuestSingleReply { Quest quest = 1; }
message QuestListReply { repeated Quest quests = 1; }

message Quest {
  string id = 1;
  string title = 2;
  string description = 3;
  string quest_giver_name = 4;
  string quest_giver_id = 5;
  Location start_location = 6;
  Location turn_in_location = 7;
  repeated string tags = 8;
  repeated Component components = 9;
  LevelRequirementTyped level_requirement = 10;
  ItemRewardsTyped item_rewards = 11;
  KillObjectiveTyped kill_objective = 12;
  CollectObjectiveTyped collect_objective = 13;
  DeliverObjectiveTyped deliver_objective = 14;
  ExploreObjectiveTyped explore_objective = 15;
  PrerequisiteQuestsTyped prerequisite_quests = 16;
  ReputationRewardsTyped reputation_rewards = 17;
  RepeatableQuestTyped repeatable = 18;
  TimeLimitTyped time_limit = 19;
}

message LevelRequirementTyped { int32 min_level = 1; int32 max_level = 2; }
message ItemRewardsTyped { repeated InventorySlot guaranteed = 1; repeated InventorySlot choice = 2; int32 choice_count = 3; }
message KillObjectiveTyped { string target_npc_id = 1; string target_npc_name = 2; int32 required_count = 3; int32 current_count = 4; }
message CollectObjectiveTyped { repeated InventorySlot required_items = 1; }
message DeliverObjectiveTyped { repeated InventorySlot items_to_deliver = 1; string deliver_to_npc_id = 2; string deliver_to_npc_name = 3; }
message ExploreObjectiveTyped { Location target_location = 1; string location_name = 2; float proximity_radius = 3; bool is_visited = 4; }
message PrerequisiteQuestsTyped { repeated string required_quest_ids = 1; }
message ReputationRewardsTyped { map<string,int32> faction_reputations = 1; }
message RepeatableQuestTyped { int32 cooldown_hours = 1; int64 last_completed_unix_ms = 2; }
message TimeLimitTyped { int32 time_limit_minutes = 1; int64 start_time_unix_ms = 2; }
