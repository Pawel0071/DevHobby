name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DevHobby.sln

      - name: Build
        run: dotnet build DevHobby.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test DevHobby.sln --no-build --verbosity normal
