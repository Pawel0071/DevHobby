global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # .NET Applications (MapPrometheusScrapingEndpoint exposes /metrics on app port)
  - job_name: 'gameserver'
    static_configs:
      - targets: ['rpg_gameserver:8080']
    metrics_path: '/metrics'

  - job_name: 'persistence_service'
    static_configs:
      - targets: ['persistence_service:80']
    metrics_path: '/metrics'

  - job_name: 'circuitbreaker'
    static_configs:
      - targets: ['circuitbreaker:80']
    metrics_path: '/metrics'

  # Infrastructure monitoring
  - job_name: 'mongodb_exporter'
    static_configs:
      - targets: ['mongodb_exporter:9216']

  - job_name: 'redis_exporter'
    static_configs:
      - targets: ['redis_exporter:9121']

  - job_name: 'rabbitmq'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Optional Node Exporter (jeśli dodasz kontener)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']
