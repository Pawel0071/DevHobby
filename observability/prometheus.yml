global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # .NET Applications (gdy dodasz /metrics endpoint)
  - job_name: 'gameserver'
    static_configs:
      - targets: ['gameserver:5000']  # Dodaj gdy będzie GameServer w compose
    metrics_path: '/metrics'

  - job_name: 'persistence_service'
    static_configs:
      - targets: ['persistence.service:80']
    metrics_path: '/metrics'

  - job_name: 'circuitbreaker'
    static_configs:
      - targets: ['circuitbreaker:80']
    metrics_path: '/metrics'

  # Infrastructure monitoring
  - job_name: 'mongodb_exporter'
    static_configs:
      - targets: ['mongodb:27017']

  - job_name: 'redis_exporter'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']  # RabbitMQ Prometheus plugin port
