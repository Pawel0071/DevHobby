version: '3.8'

services:
  # Infrastructure Services
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass
      MONGO_INITDB_DATABASE: rpgdb
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/rpgdb --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rabbit_user
      RABBITMQ_DEFAULT_PASS: rabbit_pass
      RABBITMQ_DEFAULT_VHOST: rpg_vhost
    networks:
      - backend
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Application Services
  redis.warmup:
    image: redis.warmup
    container_name: redis_warmup
    build:
      context: .
      dockerfile: RedisWormUp/Dockerfile
    environment:
      ConnectionStrings__Mongo: "mongodb://mongo_user:mongo_pass@mongodb:27017/rpgdb?authSource=admin"
      ConnectionStrings__Redis: "redis:6379"
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - backend
    restart: on-failure

  circuitbreaker:
    image: circuitbreaker
    container_name: circuitbreaker
    build:
      context: .
      dockerfile: CricuitBraker/Dockerfile
    environment:
      ConnectionStrings__Mongo: "mongodb://mongo_user:mongo_pass@mongodb:27017/rpgdb?authSource=admin"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: rabbit_user
      RabbitMQ__Password: rabbit_pass
      RabbitMQ__VirtualHost: rpg_vhost
      RabbitMQ__ExchangeName: rpg_exchange
      RabbitMQ__ExchangeType: topic
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: on-failure

  persistence.service:
    image: persistence.service
    container_name: persistence_service
    build:
      context: .
      dockerfile: RPG.PersistenceService/Dockerfile
    environment:
      ConnectionStrings__Mongo: "mongodb://mongo_user:mongo_pass@mongodb:27017/rpgdb?authSource=admin"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: rabbit_user
      RabbitMQ__Password: rabbit_pass
      RabbitMQ__VirtualHost: rpg_vhost
      RabbitMQ__ExchangeName: rpg_exchange
      RabbitMQ__ExchangeType: topic
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: on-failure

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  backend:
    driver: bridge
