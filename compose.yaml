version: '3.8'

services:
  # Infrastructure Services
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass
      MONGO_INITDB_DATABASE: rpgdb
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/rpgdb --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    environment:
      RABBITMQ_DEFAULT_USER: rabbit_user
      RABBITMQ_DEFAULT_PASS: rabbit_pass
      RABBITMQ_DEFAULT_VHOST: rpg_vhost
    networks:
      - backend
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mongodb_exporter:
    image: percona/mongodb_exporter:0.43
    container_name: mongodb_exporter
    command:
      - '--mongodb.uri=mongodb://mongo_user:mongo_pass@mongodb:27017/admin'
      - '--compatible-mode'
    ports:
      - "9216:9216"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  redis_exporter:
    image: oliver006/redis_exporter:v1.57.0
    container_name: redis_exporter
    command:
      - '--redis.addr=redis:6379'
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # Observability Stack (Grafana + Prometheus + Tempo + Loki)
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - backend
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.3.0
    container_name: tempo
    ports:
      - "3200:3200"   # Tempo HTTP
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml
      - tempo_data:/var/tempo
    command:
      - '-config.file=/etc/tempo/tempo.yml'
    networks:
      - backend
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yml
    networks:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=2019Venza
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - backend
    restart: unless-stopped

  # Application Services
  redis.warmup:
    image: redis.warmup
    container_name: redis_warmup
    build:
      context: .
      dockerfile: RedisWormUp/Dockerfile
    environment:
      ConnectionStrings__Mongo: "mongodb://mongo_user:mongo_pass@mongodb:27017/rpgdb?authSource=admin"
      ConnectionStrings__Redis: "redis:6379"
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - backend
    restart: on-failure

  circuitbreaker:
    image: circuitbreaker
    container_name: circuitbreaker
    build:
      context: .
      dockerfile: CricuitBraker/Dockerfile
    environment:
      ConnectionStrings__Mongo: "mongodb://mongo_user:mongo_pass@mongodb:27017/rpgdb?authSource=admin"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: rabbit_user
      RabbitMQ__Password: rabbit_pass
      RabbitMQ__VirtualHost: rpg_vhost
      RabbitMQ__ExchangeName: rpg_exchange
      RabbitMQ__ExchangeType: topic
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: on-failure

  persistence.service:
    image: persistence.service
    container_name: persistence_service
    build:
      context: .
      dockerfile: RPG.PersistenceService/Dockerfile
    environment:
      ConnectionStrings__Mongo: "mongodb://mongo_user:mongo_pass@mongodb:27017/rpgdb?authSource=admin"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: rabbit_user
      RabbitMQ__Password: rabbit_pass
      RabbitMQ__VirtualHost: rpg_vhost
      RabbitMQ__ExchangeName: rpg_exchange
      RabbitMQ__ExchangeType: topic
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: on-failure

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  tempo_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local

networks:
  backend:
    driver: bridge
